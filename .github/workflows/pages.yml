# Builds the site with Eleventy and publishes _site/ to GitHub Pages.
#
# - On a pull request: builds only, so a broken page or menu entry shows up
#   as a failed check before the change is merged.
# - On a push to main, or when run by hand: builds and publishes.
#
# The Pages source must be set to "GitHub Actions" in the repository settings.
# Only _site/ is published: the source, the docs and archive/ never are.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node from .nvmrc. The npm download cache is .npm-cache/, set in .npmrc;
      # setup-node reads it from npm and keeps it between runs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exact versions from package-lock.json; install scripts are off (.npmrc).
      - run: npm ci

      - run: npm run build:pages

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
