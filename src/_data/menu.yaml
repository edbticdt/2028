# The menu, in groups, following the 2026 and 2027 sites. Each item is a page
# key: the file name in src/pages/ without ".md". A key with no page stops the
# build.
#
# An item can also be written with its own label, or as an external link:
#   - { page: venue, label: Conference Venue }
#   - { label: LinkedIn, url: "https://www.linkedin.com/company/edbt-icdt-conference/" }
#
# Without a label, the menu uses the page's "menu_label" or "title" field.
#
# Kept out until there is something to link to, as on the 2027 site:
# Registration, Social Events, Program Overview, Detailed Program, Awards,
# PhD Workshop, Open Proceedings (EDBT 2028 Proceedings), Student Volunteers.

- group: General Information
  items:
    - index
    - news
    - venue
    - travel
    - accommodation

- group: Program
  items:
    - invited-keynotes
    - invited-icdt-lecture
    - accepted-papers

- group: Co-located Events
  items:
    - workshops
    - young-researcher-symposium

- group: Diversity, Equity and Inclusion (DEI)
  items:
    - dei-statement
    - dei-in-writing

- group: Calls
  items:
    - important-dates
    - calls
    - scientific-misconduct
    - edbt-reviewer-guidelines

- group: Organization
  items:
    - conference-officers
    - edbt-committees
    - icdt-committee

- group: Sponsorship
  items:
    - sponsorship

# Not a sponsor: 2027 listed LinkedIn under Sponsorship; it has its own group.
- group: Follow Us
  items:
    - { label: LinkedIn, url: "https://www.linkedin.com/company/edbt-icdt-conference/" }
